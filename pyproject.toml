[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-mob-spawner"
version = "0.1.1"
description = "Declarative YAML-driven mob spawn system for Evennia"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "yaml", "mud", "mob-spawning", "content"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
    "pyyaml",
    "evennia-yaml-reader",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-mob-spawner"
Repository = "https://github.com/FullCircleMUD/evennia-mob-spawner"
Issues = "https://github.com/FullCircleMUD/evennia-mob-spawner/issues"

[project.scripts]
ms-validate = "evennia_mob_spawner.cli:_validate_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_mob_spawner*"]
